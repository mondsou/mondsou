<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="30" cy="30" r="25" fill="url(#gradient1)" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Chart/Graph icon -->
  <g transform="translate(15, 15)">
    <!-- Bar chart bars -->
    <rect x="5" y="20" width="4" height="10" fill="white"/>
    <rect x="11" y="15" width="4" height="15" fill="white"/>
    <rect x="17" y="10" width="4" height="20" fill="white"/>
    <rect x="23" y="5" width="4" height="25" fill="white"/>
    
    <!-- Base line -->
    <line x1="3" y1="30" x2="27" y2="30" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Company name -->
  <text x="70" y="25" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#2563eb">C.K.DE. & ASSOCIATES</text>
  
  <!-- Tagline -->
  <text x="70" y="42" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#6b7280">Chartered Accountant & IT Audit Firm</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
